services:
  - type: web
    name: studio-dlc
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studio-dlc-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: REQUIRED_CHANNEL
        value: "@studiodlc"
      - key: PAYMENT_URL
        value: "https://yoomoney.ru/to/4100119440946091"
databases:
  - name: studio-dlc-db
    plan: free
    region: frankfurt
    databaseName: studio_dlc_db
    user: studio_dlc_db_user
